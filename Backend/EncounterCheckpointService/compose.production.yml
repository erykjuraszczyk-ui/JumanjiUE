services:
  checkpoint-service:
    build:
      context: ../..
      dockerfile: Backend/EncounterCheckpointService/Dockerfile
    image: jumanji/encounter-checkpoint-service:2.111.1
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s
    expose:
      - "8787"
    environment:
      JUMANJI_CHECKPOINT_BIND_HOST: "0.0.0.0"
      JUMANJI_CHECKPOINT_BIND_PORT: "8787"
      JUMANJI_CHECKPOINT_MAX_CONCURRENCY: "${CHECKPOINT_MAX_CONCURRENCY:-64}"
      JUMANJI_CHECKPOINT_SERVER_TOKEN_FILE: /run/secrets/checkpoint-server-token
      JUMANJI_CHECKPOINT_SIGNING_PRIVATE_KEY_FILE: /run/secrets/checkpoint-signing-private-key.pem
      JUMANJI_CHECKPOINT_KEY_ID: "${CHECKPOINT_ACTIVE_KEY_ID:?set CHECKPOINT_ACTIVE_KEY_ID}"
      JUMANJI_CHECKPOINT_VERIFY_KEYRING_FILE: /run/config/checkpoint-verification-keyring.json
      JUMANJI_CHECKPOINT_DATABASE_URL_FILE: /run/secrets/checkpoint-database-url
      JUMANJI_CHECKPOINT_TLS_CERT_FILE: /run/secrets/checkpoint-server-certificate.pem
      JUMANJI_CHECKPOINT_TLS_KEY_FILE: /run/secrets/checkpoint-server-private-key.pem
      JUMANJI_CHECKPOINT_MTLS_CA_FILE: /run/secrets/checkpoint-trusted-client-ca.pem
      JUMANJI_CHECKPOINT_MTLS_REQUIRED: "true"
    volumes:
      - type: bind
        source: ${CHECKPOINT_VERIFY_KEYRING_DIRECTORY:?set CHECKPOINT_VERIFY_KEYRING_DIRECTORY}
        target: /run/config/checkpoint-verification-keyring.json
        read_only: true
    secrets:
      - source: checkpoint_server_token
        target: checkpoint-server-token
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: checkpoint_signing_private_key
        target: checkpoint-signing-private-key.pem
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: checkpoint_database_url
        target: checkpoint-database-url
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: checkpoint_postgres_ca
        target: checkpoint-postgres-ca.pem
        uid: "10001"
        gid: "10001"
        mode: 0444
      - source: checkpoint_server_certificate
        target: checkpoint-server-certificate.pem
        uid: "10001"
        gid: "10001"
        mode: 0444
      - source: checkpoint_server_private_key
        target: checkpoint-server-private-key.pem
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: checkpoint_trusted_client_ca
        target: checkpoint-trusted-client-ca.pem
        uid: "10001"
        gid: "10001"
        mode: 0444
      - source: checkpoint_probe_client_certificate
        target: checkpoint-probe-client-certificate.pem
        uid: "10001"
        gid: "10001"
        mode: 0444
      - source: checkpoint_probe_client_private_key
        target: checkpoint-probe-client-private-key.pem
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: checkpoint_service_ca
        target: checkpoint-service-ca.pem
        uid: "10001"
        gid: "10001"
        mode: 0444
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl,urllib.request; c=ssl.create_default_context(cafile='/run/secrets/checkpoint-service-ca.pem'); c.load_cert_chain('/run/secrets/checkpoint-probe-client-certificate.pem','/run/secrets/checkpoint-probe-client-private-key.pem'); urllib.request.urlopen('https://checkpoint-service:8787/readyz',context=c,timeout=4).read()"
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
    networks:
      checkpoint-ingress:
        aliases:
          - checkpoint-service

secrets:
  checkpoint_server_token:
    file: ${CHECKPOINT_SERVER_TOKEN_FILE:?set CHECKPOINT_SERVER_TOKEN_FILE}
  checkpoint_signing_private_key:
    file: ${CHECKPOINT_SIGNING_PRIVATE_KEY_FILE:?set CHECKPOINT_SIGNING_PRIVATE_KEY_FILE}
  checkpoint_database_url:
    file: ${CHECKPOINT_DATABASE_URL_FILE:?set CHECKPOINT_DATABASE_URL_FILE}
  checkpoint_postgres_ca:
    file: ${CHECKPOINT_POSTGRES_CA_FILE:?set CHECKPOINT_POSTGRES_CA_FILE}
  checkpoint_server_certificate:
    file: ${CHECKPOINT_SERVER_CERTIFICATE_FILE:?set CHECKPOINT_SERVER_CERTIFICATE_FILE}
  checkpoint_server_private_key:
    file: ${CHECKPOINT_SERVER_PRIVATE_KEY_FILE:?set CHECKPOINT_SERVER_PRIVATE_KEY_FILE}
  checkpoint_trusted_client_ca:
    file: ${CHECKPOINT_TRUSTED_CLIENT_CA_FILE:?set CHECKPOINT_TRUSTED_CLIENT_CA_FILE}
  checkpoint_probe_client_certificate:
    file: ${CHECKPOINT_PROBE_CLIENT_CERTIFICATE_FILE:?set CHECKPOINT_PROBE_CLIENT_CERTIFICATE_FILE}
  checkpoint_probe_client_private_key:
    file: ${CHECKPOINT_PROBE_CLIENT_PRIVATE_KEY_FILE:?set CHECKPOINT_PROBE_CLIENT_PRIVATE_KEY_FILE}
  checkpoint_service_ca:
    file: ${CHECKPOINT_SERVICE_CA_FILE:?set CHECKPOINT_SERVICE_CA_FILE}

networks:
  checkpoint-ingress:
    external: true
    name: ${CHECKPOINT_INGRESS_NETWORK:?set CHECKPOINT_INGRESS_NETWORK}
