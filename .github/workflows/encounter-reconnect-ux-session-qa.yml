name: Encounter Reconnect UX & Session QA

on:
  pull_request:
    paths:
      - "Source/JumanjiUE/Public/JumanjiWorldEncounter.h"
      - "Source/JumanjiUE/Public/JumanjiWorldEncounterSessionSubsystem.h"
      - "Source/JumanjiUE/Private/JumanjiWorldEncounterSessionSubsystem.cpp"
      - "Source/JumanjiUE/Public/JumanjiPlayerState.h"
      - "Source/JumanjiUE/Private/JumanjiPlayerState.cpp"
      - "Source/JumanjiUE/Private/JumanjiGameMode.cpp"
      - "Source/JumanjiUE/Public/JumanjiWorldEncounterHUDWidget.h"
      - "Source/JumanjiUE/Private/JumanjiWorldEncounterHUDWidget.cpp"
      - "Scripts/validate_emerald_jungle_encounter_reconnect.py"
      - "Scripts/Tests/test_validate_emerald_jungle_encounter_reconnect.py"
      - "Scripts/validate_emerald_jungle_encounter_reconnect_ux.py"
      - "Scripts/Tests/test_validate_emerald_jungle_encounter_reconnect_ux.py"
      - "Data/Encounter/EncounterReconnectSessionQAMatrix.csv"
      - "Docs/STAGE_31_ENCOUNTER_RECONNECT_UX_SESSION_QA.md"
      - ".github/workflows/encounter-reconnect-ux-session-qa.yml"
  push:
    branches: [main]
    paths:
      - "Source/JumanjiUE/Public/JumanjiWorldEncounter.h"
      - "Source/JumanjiUE/Public/JumanjiWorldEncounterSessionSubsystem.h"
      - "Source/JumanjiUE/Private/JumanjiWorldEncounterSessionSubsystem.cpp"
      - "Source/JumanjiUE/Public/JumanjiPlayerState.h"
      - "Source/JumanjiUE/Private/JumanjiPlayerState.cpp"
      - "Source/JumanjiUE/Private/JumanjiGameMode.cpp"
      - "Source/JumanjiUE/Public/JumanjiWorldEncounterHUDWidget.h"
      - "Source/JumanjiUE/Private/JumanjiWorldEncounterHUDWidget.cpp"
      - "Scripts/validate_emerald_jungle_encounter_reconnect.py"
      - "Scripts/Tests/test_validate_emerald_jungle_encounter_reconnect.py"
      - "Scripts/validate_emerald_jungle_encounter_reconnect_ux.py"
      - "Scripts/Tests/test_validate_emerald_jungle_encounter_reconnect_ux.py"
      - "Data/Encounter/EncounterReconnectSessionQAMatrix.csv"
      - "Docs/STAGE_31_ENCOUNTER_RECONNECT_UX_SESSION_QA.md"
      - ".github/workflows/encounter-reconnect-ux-session-qa.yml"

permissions:
  contents: read

jobs:
  reconnect-session-qa:
    name: Validate reconnect UX and session QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Stage 30 server reconnect contracts
        run: python Scripts/validate_emerald_jungle_encounter_reconnect.py

      - name: Run Stage 30 reconnect contract tests
        run: python -m unittest discover -s Scripts/Tests -p "test_validate_emerald_jungle_encounter_reconnect.py" -v

      - name: Validate Stage 31 UX and QA matrix
        run: python Scripts/validate_emerald_jungle_encounter_reconnect_ux.py

      - name: Run Stage 31 UX and QA matrix tests
        run: python -m unittest discover -s Scripts/Tests -p "test_validate_emerald_jungle_encounter_reconnect_ux.py" -v
