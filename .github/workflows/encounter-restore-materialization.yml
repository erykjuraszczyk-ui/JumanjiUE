name: Encounter Restore Materialization Validation

on:
  pull_request:
    paths:
      - "Source/JumanjiUE/**"
      - "Docs/STAGE_35_ENCOUNTER_RESTORE_MATERIALIZATION_ATOMIC_PUBLISH.md"
      - "Scripts/validate_encounter_restore_materialization.py"
      - "Scripts/Tests/test_validate_encounter_restore_materialization.py"
      - "Scripts/validate_encounter_checkpoint_runtime.py"
      - "Scripts/validate_encounter_checkpoint_contract.py"
      - "Backend/EncounterCheckpointService/**"
      - ".github/workflows/encounter-checkpoint-runtime.yml"
      - ".github/workflows/encounter-restore-materialization.yml"
  push:
    branches: [main]
    paths:
      - "Source/JumanjiUE/**"
      - "Docs/STAGE_35_ENCOUNTER_RESTORE_MATERIALIZATION_ATOMIC_PUBLISH.md"
      - "Scripts/validate_encounter_restore_materialization.py"
      - "Scripts/Tests/test_validate_encounter_restore_materialization.py"
      - "Scripts/validate_encounter_checkpoint_runtime.py"
      - "Scripts/validate_encounter_checkpoint_contract.py"
      - "Backend/EncounterCheckpointService/**"
      - ".github/workflows/encounter-checkpoint-runtime.yml"
      - ".github/workflows/encounter-restore-materialization.yml"

permissions:
  contents: read

jobs:
  validate-encounter-restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Stage 32 checkpoint schema contract
        run: python Scripts/validate_encounter_checkpoint_contract.py
      - name: Validate Stage 34 checkpoint runtime boundary
        run: python Scripts/validate_encounter_checkpoint_runtime.py
      - name: Validate Stage 35 restore materialization invariants
        run: python Scripts/validate_encounter_restore_materialization.py
      - name: Run Stage 34 source regression tests
        run: python -m unittest discover -s Scripts/Tests -p "test_validate_encounter_checkpoint_runtime.py" -v
      - name: Run Stage 35 source regression tests
        run: python -m unittest discover -s Scripts/Tests -p "test_validate_encounter_restore_materialization.py" -v
      - name: Run Stage 33 backend service regression tests
        run: |
          python -m pip install -r Backend/EncounterCheckpointService/requirements.txt
          python -m unittest discover -s Scripts/Tests -p "test_encounter_checkpoint_service.py" -v
