name: Encounter Checkpoint Backend

on:
  pull_request:
    paths:
      - "Backend/EncounterCheckpointService/**"
      - "Scripts/Tests/test_encounter_checkpoint_service.py"
      - "Scripts/validate_encounter_checkpoint_backend.py"
      - "Source/JumanjiUE/**/JumanjiEncounterCheckpointBackendSubsystem.*"
      - "Source/JumanjiUE/JumanjiUE.Build.cs"
      - "Docs/STAGE_33_ENCOUNTER_CHECKPOINT_BACKEND_LEASE_SERVICE.md"
      - ".github/workflows/encounter-checkpoint-backend.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "Backend/EncounterCheckpointService/**"
      - "Scripts/Tests/test_encounter_checkpoint_service.py"
      - "Scripts/validate_encounter_checkpoint_backend.py"
      - "Source/JumanjiUE/**/JumanjiEncounterCheckpointBackendSubsystem.*"
      - "Source/JumanjiUE/JumanjiUE.Build.cs"
      - "Docs/STAGE_33_ENCOUNTER_CHECKPOINT_BACKEND_LEASE_SERVICE.md"
      - ".github/workflows/encounter-checkpoint-backend.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Checkpoint backend concurrency and signature tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r Backend/EncounterCheckpointService/requirements.txt
      - name: Validate checkpoint backend integration
        run: python Scripts/validate_encounter_checkpoint_backend.py
      - name: Run lease, CAS and Ed25519 tests
        run: python -m unittest discover -s Scripts/Tests -p "test_encounter_checkpoint_service.py" -v
