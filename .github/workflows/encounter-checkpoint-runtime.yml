name: Encounter Checkpoint Runtime Validation

on:
  pull_request:
    paths:
      - "Source/JumanjiUE/**"
      - "Docs/STAGE_34_ENCOUNTER_SAFEPOINT_SNAPSHOT_RESTORE_STAGING.md"
      - "Scripts/validate_encounter_checkpoint_runtime.py"
      - "Scripts/Tests/test_validate_encounter_checkpoint_runtime.py"
      - "Scripts/validate_encounter_checkpoint_contract.py"
      - "Data/Encounter/EncounterCheckpoint.schema.json"
      - "Data/Encounter/EncounterCheckpointExample.json"
      - "Data/Encounter/EncounterCheckpointRecoveryMatrix.csv"
      - ".github/workflows/encounter-checkpoint-runtime.yml"
  push:
    branches: [main]
    paths:
      - "Source/JumanjiUE/**"
      - "Docs/STAGE_34_ENCOUNTER_SAFEPOINT_SNAPSHOT_RESTORE_STAGING.md"
      - "Scripts/validate_encounter_checkpoint_runtime.py"
      - "Scripts/Tests/test_validate_encounter_checkpoint_runtime.py"
      - "Scripts/validate_encounter_checkpoint_contract.py"
      - "Data/Encounter/EncounterCheckpoint.schema.json"
      - "Data/Encounter/EncounterCheckpointExample.json"
      - "Data/Encounter/EncounterCheckpointRecoveryMatrix.csv"
      - ".github/workflows/encounter-checkpoint-runtime.yml"

permissions:
  contents: read

jobs:
  validate-checkpoint-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Stage 32 checkpoint contract
        run: python Scripts/validate_encounter_checkpoint_contract.py
      - name: Validate Stage 34 runtime wiring and privacy boundary
        run: python Scripts/validate_encounter_checkpoint_runtime.py
      - name: Run Stage 34 runtime contract tests
        run: python -m unittest discover -s Scripts/Tests -p "test_validate_encounter_checkpoint_runtime.py" -v
      - name: Run Stage 33 backend service regression tests
        run: |
          python -m pip install -r Backend/EncounterCheckpointService/requirements.txt
          python -m unittest discover -s Scripts/Tests -p "test_encounter_checkpoint_service.py" -v
