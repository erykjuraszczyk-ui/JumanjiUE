name: Encounter Recovery Capacity Planning & SLO Baselines

on:
  pull_request:
    paths:
      - "Data/Encounter/EncounterRecoverySLOProfiles.csv"
      - "Data/Encounter/EncounterRecoveryHostInventoryTemplate.json"
      - "Scripts/plan_encounter_recovery_capacity.py"
      - "Scripts/validate_encounter_recovery_capacity_slo.py"
      - "Scripts/Tests/test_encounter_recovery_capacity_planning.py"
      - "Scripts/Tests/test_validate_encounter_recovery_capacity_slo.py"
      - "Scripts/benchmark_encounter_checkpoint_recovery.py"
      - "Scripts/validate_encounter_recovery_benchmark.py"
      - "Scripts/Tests/test_encounter_recovery_benchmark.py"
      - "Scripts/Tests/test_validate_encounter_recovery_benchmark.py"
      - "Docs/STAGE_40_RECOVERY_CAPACITY_PLANNING_SLO_BASELINES.md"
      - ".github/workflows/encounter-recovery-capacity-slo.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "Data/Encounter/EncounterRecoverySLOProfiles.csv"
      - "Data/Encounter/EncounterRecoveryHostInventoryTemplate.json"
      - "Scripts/plan_encounter_recovery_capacity.py"
      - "Scripts/validate_encounter_recovery_capacity_slo.py"
      - "Scripts/Tests/test_encounter_recovery_capacity_planning.py"
      - "Scripts/Tests/test_validate_encounter_recovery_capacity_slo.py"
      - "Scripts/benchmark_encounter_checkpoint_recovery.py"
      - "Scripts/validate_encounter_recovery_benchmark.py"
      - "Scripts/Tests/test_encounter_recovery_benchmark.py"
      - "Scripts/Tests/test_validate_encounter_recovery_benchmark.py"
      - "Docs/STAGE_40_RECOVERY_CAPACITY_PLANNING_SLO_BASELINES.md"
      - ".github/workflows/encounter-recovery-capacity-slo.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  capacity-slo:
    name: Validate SLO governance and capacity planner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checkpoint backend dependencies
        run: python -m pip install -r Backend/EncounterCheckpointService/requirements.txt
      - name: Validate Stage 40 profiles and source wiring
        run: python Scripts/validate_encounter_recovery_capacity_slo.py
      - name: Test Stage 40 SLO governance
        run: python -m unittest discover -s Scripts/Tests -p "test_validate_encounter_recovery_capacity_slo.py" -v
      - name: Test Stage 40 capacity planner
        run: python -m unittest discover -s Scripts/Tests -p "test_encounter_recovery_capacity_planning.py" -v
      - name: Validate and test Stage 39 benchmark harness
        run: |
          python Scripts/validate_encounter_recovery_benchmark.py
          python -m unittest discover -s Scripts/Tests -p "test_validate_encounter_recovery_benchmark.py" -v
          python -m unittest discover -s Scripts/Tests -p "test_encounter_recovery_benchmark.py" -v
      - name: Run Stage 39 real-service smoke benchmark
        run: |
          mkdir -p Artifacts/Stage40
          python Scripts/benchmark_encounter_checkpoint_recovery.py \
            --duration-seconds 3 --workers 2 --warmup-iterations 1 \
            --lease-ttl-seconds 120 \
            --report Artifacts/Stage40/ci-smoke-report.json
      - name: Build CI-only capacity plan
        run: |
          python Scripts/plan_encounter_recovery_capacity.py \
            --report Artifacts/Stage40/ci-smoke-report.json \
            --profile CI-SMOKE \
            --output Artifacts/Stage40/ci-smoke-capacity-plan.json
      - name: Upload planning evidence
        uses: actions/upload-artifact@v4
        with:
          name: encounter-recovery-capacity-ci-smoke
          path: Artifacts/Stage40/
          if-no-files-found: error
          retention-days: 14
      - name: Run Stage 32 contract and Stage 33 backend regression
        run: |
          python Scripts/validate_encounter_checkpoint_contract.py
          python Scripts/validate_encounter_checkpoint_backend.py
          python -m unittest discover -s Scripts/Tests -p "test_encounter_checkpoint_service.py" -v
